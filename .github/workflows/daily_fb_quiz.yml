name: Daily Facebook AI Quiz & MCQ Poster

on:
  schedule:
    # 10:00 AM BST (Bangladesh Standard Time = UTC+6) -> 04:00 UTC: Question 1
    - cron: '0 4 * * *'
    # 12:00 PM BST -> 06:00 UTC: Answer 1
    - cron: '0 6 * * *'
    # 02:00 PM BST -> 08:00 UTC: Question 2
    - cron: '0 8 * * *'
    # 04:00 PM BST -> 10:00 UTC: Answer 2
    - cron: '0 10 * * *'
    # 06:00 PM BST -> 12:00 UTC: Question 3
    - cron: '0 12 * * *'
    # 08:00 PM BST -> 14:00 UTC: Answer 3
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - post_question
          - post_answer
      slot:
        description: 'Slot number (1, 2, or 3 - ignored if action is auto)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
      subject:
        description: 'Course Subject'
        required: true
        default: 'arabic'
        type: choice
        options:
          - arabic
          - english
      test_mode:
        description: 'Run in test / dry-run mode (does not post to Facebook)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt

      - name: Run Daily Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_TARGET_ID: ${{ secrets.FB_TARGET_ID }}
          SUBJECT: ${{ secrets.SUBJECT || 'arabic' }}
          GEMINI_MODEL: 'gemini-1.5-flash'
        run: |
          CMD="python automation/daily_bot.py"
          
          # Check if manual run
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="$CMD --subject ${{ inputs.subject }}"
            if [ "${{ inputs.action }}" != "auto" ]; then
              CMD="$CMD --action ${{ inputs.action }} --slot ${{ inputs.slot }}"
            else
              CMD="$CMD --auto"
            fi
            
            if [ "${{ inputs.test_mode }}" = "true" ]; then
              CMD="$CMD --test"
            fi
          else
            # Scheduled cron run
            CMD="$CMD --auto"
          fi
          
          echo "Executing: $CMD"
          $CMD

      - name: Commit and push updated state
        run: |
          git config --global user.name "LPC Quiz Bot"
          git config --global user.email "bot@lpc-language-portal.local"
          git add automation/state.json automation/curriculum.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(bot): update daily quiz state [skip ci]" && git push)
